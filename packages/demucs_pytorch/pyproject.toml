[project]
name = "demucs-pytorch"
version = "0.1.0"
description = "Local Demucs PyTorch server (ASR + separation)"
requires-python = ">=3.12"
dependencies = [
    "servers-py",
    "fastapi",
    "uvicorn[standard]",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["demucs_pytorch*"]
