[package]
name = "voxcpm-cloud"
version = "0.1.0"
edition = "2024"

[dependencies]
gradio = { git = "https://github.com/JacobLinCool/gradio-rs", tag = "v0.4.2" }
vox-core = { path = "../vox-core" }
anyhow = "1"
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.12" }
serde = { version = "1", features = ["derive"] }
clap = { workspace = true }
