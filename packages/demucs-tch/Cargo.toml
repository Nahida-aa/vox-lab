[workspace]

[package]
name = "demucs-tch"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "demucs-tch"
path = "src/bin/demucs-tch.rs"

[dependencies]
tch = { version = "0.27", features = ["download-libtorch"] }
safetensors = "0.5"
hound = "3"
realfft = "3.5.0"
num-complex = "0.4"
half = "2"
dirs = "5"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
bytemuck = "1"
