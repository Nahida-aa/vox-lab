[workspace]
members = ["packages/voice-cloning","packages/vox-core","packages/voxcpm-cloud",
    "packages/demucs-burn",
    "packages/voxcpm-burn",
    "submodule/voxcpm-rs",
    "submodule/voxcpm-rs/vendor/patched/burn-cubecl",
    "submodule/voxcpm-rs/vendor/patched/cubecl-spirv",
]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
voxcpm-rs = { path = "submodule/voxcpm-rs" }
