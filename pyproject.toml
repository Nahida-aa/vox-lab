[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vox-lab"
version = "0.1.0"
description = "vox-lab Python ML server dependencies"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
include = []

[tool.uv.workspace]
members = [
    "packages/voxcpm_torch_server",
    "packages/demucs_torch_server",
    "packages/servers_py",
]

[tool.uv.sources]
servers-py = { workspace = true }