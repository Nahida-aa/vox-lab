name: release-demucs-tch-windows

# 手动触发: 构建 demucs-tch (tch-rs / libtorch CPU) 的 Windows
# (x86_64-pc-windows-msvc) 资产并上传到对应 GitHub Release。
#
# 资产形态: zip, tch-rs 动态链 libtorch (torch-sys 的 download-libtorch 产物),
# zip 内 exe + libtorch dll 平铺 (解压目录即 bin dir)。
# 命名: demucs-tch-x86_64-pc-windows-msvc.zip (与 linux 形态一致)。
#
# 已知前提:
#   - torch-sys 经 download-libtorch 拉官方 Windows libtorch (dll, PyTorch 2.15)。
#   - 额外打包 MSVC runtime dll (msvcp140 等), 目标机可能缺失。
#   - 冒烟仅验证 exe 可启动 (--help exit 0): runner 无 GPU。
#
# 注意: demucs-tch 是独立 workspace (不依赖主 workspace 的 Burn),
# 因此需在 packages/demucs-tch 目录下执行 cargo build。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "构建并上传 demucs-tch 到 demucs-tch-v0.1.0"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: build release bin
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload }}" != "false" ]; then
            cargo build --release --bin demucs-tch --manifest-path packages/demucs-tch/Cargo.toml
          fi
          ls -la packages/demucs-tch/target/release/demucs-tch.exe 2>/dev/null || true

      - name: smoke test (可启动, libtorch depends 齐全)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload }}" != "false" ]; then
            libtorch_dir=$(find packages/demucs-tch/target/release/build -maxdepth 6 -type d -path "*torch-sys-*/out/libtorch/libtorch/lib" | head -1)
            [ -n "$libtorch_dir" ] || { echo "libtorch dir not found"; exit 1; }
            PATH="$libtorch_dir:$PATH" ./packages/demucs-tch/target/release/demucs-tch.exe --help >/dev/null
          fi
          echo "smoke ok"

      - name: package zip + sha256
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$out_dir"
          if [ "${{ github.event.inputs.upload }}" != "false" ]; then
            staging="$out_dir/demucs-tch"
            mkdir -p "$staging"
            cp packages/demucs-tch/target/release/demucs-tch.exe "$staging/"
            # libtorch dll 平铺进 zip (与 exe 同目录) + MSVC runtime dll
            libtorch_dir=$(find packages/demucs-tch/target/release/build -maxdepth 6 -type d -path "*torch-sys-*/out/libtorch/libtorch/lib" | head -1)
            cp "$libtorch_dir"/*.dll "$staging/" 2>/dev/null || true
            for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll concrt140.dll; do
              cp "C:/Windows/System32/$dll" "$staging/" 2>/dev/null || true
            done
            pushd "$staging" >/dev/null
            asset="$out_dir/demucs-tch-x86_64-pc-windows-msvc.zip"
            powershell -Command "Compress-Archive -Path * -DestinationPath '$asset'" 2>/dev/null || powershell -Command "Compress-Archive -LiteralPath (Get-ChildItem).FullName -DestinationPath '$asset'"
            popd >/dev/null
            hash=$(powershell -Command "(Get-FileHash '$asset' -Algorithm SHA256).Hash.ToLower()")
            echo "demucs-tch-x86_64-pc-windows-msvc.zip  $hash  $(stat -c%s "$asset")" | tee -a "$out_dir/sha256.txt"
          fi

      - name: upload asset to release
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          gh release create demucs-tch-v0.1.0 --title "demucs-tch v0.1.0" --notes "demucs-tch Linux + Windows 资产 (tch-rs / libtorch CPU, zip 平铺)" 2>/dev/null || echo "release 已存在, 继续"
          if [ "${{ github.event.inputs.upload }}" != "false" ]; then
            gh release upload demucs-tch-v0.1.0 "$out_dir/demucs-tch-x86_64-pc-windows-msvc.zip" --clobber
          fi
          cat "$out_dir/sha256.txt"
