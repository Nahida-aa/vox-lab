name: release-demucs-tch-windows

# 手动触发: 构建 demucs-tch 的 Windows (x86_64-pc-windows-msvc) cpu/cuda 资产
# 并上传到 demucs-tch-v0.1.0 release。
#
# 为什么按 backend 拆 job: tch 没有 cuda feature, torch-sys 构建时探测 libtorch
# 目录里有没有 torch_cuda.dll 决定链接哪套库 (build.rs:446)。一次构建只能一个后端。
#
# 资产:
#   demucs-tch-cpu-x86_64-pc-windows-msvc.zip   exe + libtorch dll 平铺
#   demucs-tch-cuda-...zip                      仅 exe (libtorch cuda 体积过大, 需自备)
#
# 版本约束: torch-sys 0.27 硬校验 PyTorch 2.15.0。Windows 的 2.15.0 cuda
# 预编译包若尚未发布, 该 job 跳过 (不红), 发布后自动生效。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "构建并上传 demucs-tch 到 demucs-tch-v0.1.0"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cpu
            libtorch_url: ""
          - backend: cuda
            libtorch_url: "https://download.pytorch.org/libtorch/cu130/libtorch-win-shared-with-deps-2.15.0%2Bcu130.zip"
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: check libtorch availability
        id: avail
        shell: bash
        run: |
          set -euo pipefail
          url="${{ matrix.libtorch_url }}"
          if [ -z "$url" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -sIL -o /dev/null -w '%{http_code}' --retry 3 --max-time 60 "$url")
          if [ "$code" = "200" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::${{ matrix.backend }} 跳过: 2.15.0 Windows libtorch 尚未发布 ($code)"
          fi

      - name: fetch libtorch
        if: steps.avail.outputs.skip != 'true' && matrix.libtorch_url != ''
        shell: bash
        run: |
          set -euo pipefail
          curl -L --retry 3 -o "$RUNNER_TEMP/libtorch.zip" "${{ matrix.libtorch_url }}"
          mkdir -p "$RUNNER_TEMP/libtorch"
          unzip -q "$RUNNER_TEMP/libtorch.zip" -d "$RUNNER_TEMP/libtorch"
          echo "LIBTORCH=$RUNNER_TEMP/libtorch/libtorch" >> "$GITHUB_ENV"

      - name: build release bin
        if: steps.avail.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --bin demucs-tch \
            --manifest-path packages/demucs-tch/Cargo.toml \
            --target-dir "packages/demucs-tch/target/${{ matrix.backend }}"
          ls -la "packages/demucs-tch/target/${{ matrix.backend }}/release/demucs-tch.exe"

      - name: smoke test (可启动)
        if: steps.avail.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.backend }}" = "cpu" ]; then
            lib_dir=$(find "packages/demucs-tch/target/${{ matrix.backend }}/release/build" -maxdepth 6 -type d -path "*torch-sys-*/out/libtorch/libtorch/lib" | head -1)
          else
            lib_dir="$LIBTORCH/lib"
          fi
          [ -n "$lib_dir" ] || { echo "libtorch dir not found"; exit 1; }
          PATH="$lib_dir:$PATH" "packages/demucs-tch/target/${{ matrix.backend }}/release/demucs-tch.exe" --help > /dev/null
          echo "smoke ok (${{ matrix.backend }})"

      - name: package zip + sha256
        if: steps.avail.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$out_dir"
          staging="$out_dir/demucs-tch-${{ matrix.backend }}"
          mkdir -p "$staging"
          cp "packages/demucs-tch/target/${{ matrix.backend }}/release/demucs-tch.exe" "$staging/"
          if [ "${{ matrix.backend }}" = "cpu" ]; then
            lib_dir=$(find "packages/demucs-tch/target/${{ matrix.backend }}/release/build" -maxdepth 6 -type d -path "*torch-sys-*/out/libtorch/libtorch/lib" | head -1)
            cp "$lib_dir"/*.dll "$staging/" 2>/dev/null || true
            for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll concrt140.dll; do
              cp "C:/Windows/System32/$dll" "$staging/" 2>/dev/null || true
            done
          fi
          pushd "$staging" > /dev/null
          asset="$out_dir/demucs-tch-${{ matrix.backend }}-x86_64-pc-windows-msvc.zip"
          powershell -Command "Compress-Archive -Path * -DestinationPath '$asset'" 2>/dev/null || \
            powershell -Command "Compress-Archive -LiteralPath (Get-ChildItem).FullName -DestinationPath '$asset'"
          popd > /dev/null
          hash=$(powershell -Command "(Get-FileHash '$asset' -Algorithm SHA256).Hash.ToLower()")
          echo "demucs-tch-${{ matrix.backend }}-x86_64-pc-windows-msvc.zip  $hash  $(stat -c%s "$asset")" | tee -a "$out_dir/sha256.txt"

      - name: create release (幂等)
        if: steps.avail.outputs.skip != 'true'
        shell: bash
        run: |
          gh release create demucs-tch-v0.1.0 --title "demucs-tch v0.1.0" --notes "demucs-tch 资产 (cpu / cuda / rocm 三分支)" 2>/dev/null || echo "release 已存在, 继续"

      - name: upload asset to release
        if: steps.avail.outputs.skip != 'true' && github.event.inputs.upload != 'false'
        shell: bash
        run: |
          set -euo pipefail
          gh release upload demucs-tch-v0.1.0 "$RUNNER_TEMP/out/demucs-tch-${{ matrix.backend }}-x86_64-pc-windows-msvc.zip" --clobber

      - name: print sha256
        if: steps.avail.outputs.skip != 'true'
        shell: bash
        run: cat "$RUNNER_TEMP/out/sha256.txt"
