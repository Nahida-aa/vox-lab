name: release-demucs-linux

# 手动触发: 构建 demucs-burn 的 Linux (x86_64-unknown-linux-gnu) wgpu 资产并上传到
# vox-lab 对应 GitHub Release。
#
# 资产形态: zip, 解压目录即 bin dir。wgpu 后端无外部动态库 (经系统 Vulkan), 单 exe 塞 zip。
# 命名: demucs-burn-wgpu-x86_64-unknown-linux-gnu.zip, 与 Windows 形态一致。
#
# 注意: tch 后端已独立为 packages/demucs-tch (tch-rs, 脱离 Burn),
# 其 Linux 资产由 release-demucs-tch-linux.yml 单独发布。
# 已知前提: 冒烟仅验证 exe 可启动 + --model-dir 路径解析。

on:
  workflow_dispatch:
    inputs:
      upload_wgpu:
        description: "构建并上传 demucs-burn-wgpu 到 demucs-burn-v0.1.0"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: build release bins
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            cargo build --release -p demucs-burn --bin demucs-burn-wgpu --no-default-features --features wgpu
          fi
          ls -la target/release/demucs-burn-* 2>/dev/null || true

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            ./target/release/demucs-burn-wgpu --help >/dev/null
          fi
          echo "smoke ok"

      - name: package zips + sha256
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$out_dir"
          declare -a bins=()
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then bins+=("demucs-burn-wgpu"); fi

          for b in "${bins[@]}"; do
            staging="$out_dir/$b"
            mkdir -p "$staging"
            cp "target/release/$b" "$staging/"
            # zip 内文件平铺到根 (解压目录即 bin dir)
            pushd "$staging" >/dev/null
            asset="$out_dir/$b-x86_64-unknown-linux-gnu.zip"
            zip -q -r "$asset" .
            popd >/dev/null
            hash=$(sha256sum "$asset" | awk '{print $1}')
            echo "$b-x86_64-unknown-linux-gnu.zip  $hash  $(stat -c%s "$asset")" | tee -a "$out_dir/sha256.txt"
          done

      - name: create release (幂等)
        shell: bash
        run: |
          gh release create demucs-burn-v0.1.0 --title "demucs-burn v0.1.0" --notes "demucs-burn Linux 资产 (wgpu, zip 平铺)" 2>/dev/null || echo "release 已存在, 继续"

      - name: upload assets to releases
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            gh release upload demucs-burn-v0.1.0 "$out_dir/demucs-burn-wgpu-x86_64-unknown-linux-gnu.zip" --clobber
          fi
          echo "upload done"

      - name: print sha256
        shell: bash
        run: |
          cat "$RUNNER_TEMP/out/sha256.txt"
