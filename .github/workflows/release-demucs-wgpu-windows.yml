name: release-demucs-wgpu-windows

# 手动触发: 构建 demucs-wgpu 的 Windows (x86_64-pc-windows-msvc) 资产并上传到
# vox-lab 对应 GitHub Release。与 release-demucs-wgpu-linux.yml 保持同一份逻辑。
#
# 资产形态: zip, 单 exe (Windows 走 DX12 backend), 无外部动态库。
# 命名: demucs-wgpu-x86_64-pc-windows-msvc.zip (与 linux 形态一致, 仅 target-triple 不同)。
#
# 与 burn/tch workflow 的差异: packages/demucs-wgpu 是独立 workspace (自带
# Cargo.lock 与 target), 必须在其目录内构建, 不能用主 workspace 的 -p 选择器。
# 依赖 submodule/demucs-wgpu 的 demucs-core (path 依赖), checkout 必须 recursive。
# 已知前提: 冒烟仅验证 exe 可启动 (--help exit 0): runner 无 GPU。

on:
  workflow_dispatch:
    inputs:
      upload:
        description: "构建并上传 demucs-wgpu 到 demucs-wgpu-v0.1.0"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: build release bin
        shell: bash
        working-directory: packages/demucs-wgpu
        run: |
          set -euo pipefail
          cargo build --release --bin demucs-wgpu
          ls -la target/release/demucs-wgpu.exe

      - name: smoke test
        shell: bash
        working-directory: packages/demucs-wgpu
        run: |
          set -euo pipefail
          ./target/release/demucs-wgpu.exe --help >/dev/null
          echo "smoke ok"

      - name: package zip + sha256
        shell: bash
        working-directory: packages/demucs-wgpu
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$out_dir"
          staging="$out_dir/demucs-wgpu"
          mkdir -p "$staging"
          cp target/release/demucs-wgpu.exe "$staging/"
          pushd "$staging" >/dev/null
          asset="$out_dir/demucs-wgpu-x86_64-pc-windows-msvc.zip"
          powershell -Command "Compress-Archive -Path * -DestinationPath '$asset'" 2>/dev/null || powershell -Command "Compress-Archive -LiteralPath (Get-ChildItem).FullName -DestinationPath '$asset'"
          popd >/dev/null
          hash=$(powershell -Command "(Get-FileHash '$asset' -Algorithm SHA256).Hash.ToLower()")
          echo "demucs-wgpu-x86_64-pc-windows-msvc.zip  $hash  $(stat -c%s "$asset")" | tee -a "$out_dir/sha256.txt"

      - name: upload asset to release
        shell: bash
        run: |
          set -euo pipefail
          gh release create demucs-wgpu-v0.1.0 --title "demucs-wgpu v0.1.0" --notes "demucs-wgpu Linux + Windows 资产 (WGSL kernel, Vulkan, zip 平铺)" 2>/dev/null || echo "release 已存在, 继续"
          if [ "${{ github.event.inputs.upload }}" != "false" ]; then
            gh release upload demucs-wgpu-v0.1.0 "$RUNNER_TEMP/out/demucs-wgpu-x86_64-pc-windows-msvc.zip" --clobber
          fi
          cat "$RUNNER_TEMP/out/sha256.txt"
