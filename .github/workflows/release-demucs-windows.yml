name: release-demucs-windows

# 手动触发: 构建 demucs-burn 的 Windows (x86_64-pc-windows-msvc) wgpu 资产并上传到
# vox-lab 对应 GitHub Release。与 release-demucs-linux.yml 保持同一份逻辑。
#
# 资产形态: zip, wgpu 后端单 exe (Windows 走 DX12 backend), 无外部动态库。
# 命名: demucs-burn-wgpu-x86_64-pc-windows-msvc.zip (与 linux 形态一致, 仅 target-triple 不同)。
#
# 注意: tch 后端已独立为 packages/demucs-tch (tch-rs, 脱离 Burn),
# 其 Windows 资产由 release-demucs-tch-windows.yml 单独发布。
# 已知前提: 冒烟仅验证 exe 可启动 (--help exit 0): runner 无 GPU。

on:
  workflow_dispatch:
    inputs:
      upload_wgpu:
        description: "构建并上传 demucs-burn-wgpu 到 demucs-burn-v0.1.0"
        type: boolean
        default: true

permissions:
  contents: write

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: build release bins
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            cargo build --release -p demucs-burn --bin demucs-burn-wgpu --no-default-features --features wgpu
          fi
          ls -la target/release/demucs-burn-*.exe 2>/dev/null || true

      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            ./target/release/demucs-burn-wgpu.exe --help >/dev/null
          fi
          echo "smoke ok"

      - name: package zips + sha256
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          mkdir -p "$out_dir"
          declare -a bins=()
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then bins+=("demucs-burn-wgpu"); fi

          for b in "${bins[@]}"; do
            staging="$out_dir/$b"
            mkdir -p "$staging"
            cp "target/release/$b.exe" "$staging/"
            pushd "$staging" >/dev/null
            asset="$out_dir/$b-x86_64-pc-windows-msvc.zip"
            powershell -Command "Compress-Archive -Path * -DestinationPath '$asset'" 2>/dev/null || powershell -Command "Compress-Archive -LiteralPath (Get-ChildItem).FullName -DestinationPath '$asset'"
            popd >/dev/null
            hash=$(powershell -Command "(Get-FileHash '$asset' -Algorithm SHA256).Hash.ToLower()")
            echo "$b-x86_64-pc-windows-msvc.zip  $hash  $(stat -c%s "$asset")" | tee -a "$out_dir/sha256.txt"
          done

      - name: upload assets to releases
        shell: bash
        run: |
          set -euo pipefail
          out_dir="$RUNNER_TEMP/out"
          gh release create demucs-burn-v0.1.0 --title "demucs-burn v0.1.0" --notes "demucs-burn Linux + Windows 资产 (wgpu, zip 平铺)" 2>/dev/null || echo "release 已存在, 继续"
          if [ "${{ github.event.inputs.upload_wgpu }}" != "false" ]; then
            gh release upload demucs-burn-v0.1.0 "$out_dir/demucs-burn-wgpu-x86_64-pc-windows-msvc.zip" --clobber
          fi
          cat "$out_dir/sha256.txt"
